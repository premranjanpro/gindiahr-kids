<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>चालाक खरगोश और खूंखार शेर | GINDiA Kids</title>
    <meta name="description" content="Listen to The Clever Rabbit and the Lion with live word-by-word karaoke and smooth auto-scroll on GINDiA Kids."/>
    <link rel="icon" type="image/png" href="https://gindiahr.com/images/logo/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800;900&family=Baloo+2:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-grad: linear-gradient(135deg, #FF6B35 0%, #E83E8C 50%, #7928CA 100%);
            --accent: #E83E8C;
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-dim: #94A3B8;
            --border: #E2E8F0;
            --highlight-word: #FF6B35;
            --highlight-bg: #FFE8DF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        a { text-decoration: none; color: inherit; }

        .player-appbar {
            height: 60px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid;
            border-image: var(--primary-grad) 1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            z-index: 100;
            gap: 8px;
        }
        .player-back-btn {
            background: #F1F5F9;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .player-back-btn:hover { background: #E2E8F0; }

        .player-title-box { text-align: center; flex: 1; min-width: 0; }
        .badge-brand {
            font-size: 10px;
            font-weight: 900;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
        }
        .story-header-name {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .voice-dropdown-wrap { position: relative; flex-shrink: 0; }
        .voice-select {
            appearance: none;
            -webkit-appearance: none;
            background: var(--primary-grad);
            color: #FFFFFF;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 12px;
            font-weight: 700;
            padding: 7px 28px 7px 12px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
            outline: none;
        }
        .voice-select option { background: #FFFFFF; color: #0F172A; font-weight: 600; }
        .dropdown-chevron {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 9px;
            color: #FFFFFF;
        }

        .story-meta-bar {
            background: #FFFFFF;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .story-badge-cat {
            font-size: 11px;
            font-weight: 800;
            color: #FF6B35;
            background: #FFE8DF;
            padding: 3px 10px;
            border-radius: 50px;
        }
        .wave-visualizer { display: flex; align-items: center; gap: 3px; height: 16px; }
        .wave-bar { width: 3px; height: 5px; background: #CBD5E1; border-radius: 2px; transition: height 0.15s ease; }
        .wave-bar.playing { animation: waveBounce 0.8s ease-in-out infinite alternate; }
        .wave-bar:nth-child(1) { background: #FF6B35; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 10px; background: #E83E8C; }
        .wave-bar:nth-child(3) { animation-delay: 0.25s; height: 16px; background: #06D6A0; }
        .wave-bar:nth-child(4) { animation-delay: 0.15s; height: 8px; background: #118AB2; }
        .wave-bar:nth-child(5) { animation-delay: 0.3s; height: 12px; background: #FF6B35; }
        @keyframes waveBounce { 0% { height: 4px; } 100% { height: 16px; } }

        .story-reader-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            background: #FFFFFF;
            margin: 10px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .story-reader-container::-webkit-scrollbar { width: 4px; }
        .story-reader-container::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

        .story-title-card { text-align: center; padding-bottom: 12px; border-bottom: 1px dashed var(--border); margin-bottom: 8px; }
        .story-hero-emoji { font-size: 40px; margin-bottom: 4px; }
        .story-hero-title { font-family: 'Baloo 2', cursive; font-size: 22px; font-weight: 900; color: var(--text-main); line-height: 1.25; }
        .story-hero-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        .story-sentence-block {
            font-family: 'Baloo 2', cursive;
            font-size: 19px;
            line-height: 1.75;
            color: var(--text-dim);
            padding: 10px 14px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .story-sentence-block:hover { background: #F8FAFC; color: var(--text-muted); }
        .story-sentence-block.sentence-active {
            color: var(--text-main);
            background: #FFF7ED;
            border-left: 4px solid var(--primary);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.08);
            font-size: 20px;
            font-weight: 700;
            transform: scale(1.01);
        }

        .karaoke-word { display: inline-block; padding: 1px 3px; border-radius: 5px; transition: all 0.12s ease; }
        .karaoke-word.word-active {
            color: var(--highlight-word) !important;
            background: var(--highlight-bg) !important;
            font-weight: 900 !important;
            transform: scale(1.08);
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.25);
        }

        .player-bottom-sheet {
            background: #FFFFFF;
            border-top: 1px solid var(--border);
            padding: 10px 16px 14px;
            box-shadow: 0 -6px 25px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-main-controls { display: flex; align-items: center; justify-content: space-around; max-width: 440px; margin: 0 auto; width: 100%; }
        .btn-ctrl-sec {
            background: #F1F5F9;
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-ctrl-sec:hover { background: #E2E8F0; transform: scale(1.06); }
        .btn-ctrl-play {
            background: var(--primary-grad);
            border: none;
            color: #FFFFFF;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
            transition: all 0.2s;
        }
        .btn-ctrl-play:hover { transform: scale(1.08); }

        .player-sub-controls { display: flex; justify-content: space-between; align-items: center; max-width: 440px; margin: 0 auto; width: 100%; }
        .btn-pill-sub {
            background: #F8FAFC;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-pill-sub:hover { background: #F1F5F9; color: var(--text-main); }

        #confetti-box { position: fixed; inset: 0; pointer-events: none; z-index: 100000; }
        .confetti-dot { position: absolute; top: -10px; animation: confettiDrop ease-in forwards; }
        @keyframes confettiDrop { to { transform: translateY(105vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="confetti-box"></div>

    <header class="player-appbar">
        <a href="category-panchatantra.html" class="player-back-btn">← Back</a>
        
        <div class="player-title-box">
            <span class="badge-brand">✨ GINDiA Kids</span>
            <div class="story-header-name">चालाक खरगोश और शेर</div>
        </div>

        <div class="voice-dropdown-wrap">
            <select class="voice-select" id="voice-select" onchange="onVoiceDropdownChange(this.value)">
                <option value="female" selected>👩 Female (महिला)</option>
                <option value="male">👨 Male (पुरुष)</option>
                <option value="child">🧒 Child (बच्चा)</option>
            </select>
            <span class="dropdown-chevron">▼</span>
        </div>
    </header>

    <div class="story-meta-bar">
        <span class="story-badge-cat">🦁 पंचतंत्र • Panchatantra</span>
        <div class="wave-visualizer">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
    </div>

    <main class="story-reader-container" id="story-reader">
        <div class="story-title-card">
            <div class="story-hero-emoji">🦁</div>
            <h1 class="story-hero-title" id="player-title">चालाक खरगोश और खूंखार शेर</h1>
            <p class="story-hero-subtitle" id="player-sub">The Clever Rabbit and the Lion</p>
        </div>

        <div id="sentences-list" style="display:flex; flex-direction:column; gap:12px;"></div>
    </main>

    <div class="player-bottom-sheet">
        <div class="player-main-controls">
            <button class="btn-ctrl-sec" onclick="prevSentence()" title="पिछला वाक्य">⏮️</button>
            <button class="btn-ctrl-play" id="btn-play-pause" onclick="togglePlayPause()" title="Play / Pause">⏸</button>
            <button class="btn-ctrl-sec" onclick="nextSentence()" title="अगला वाक्य">⏭️</button>
        </div>
        <div class="player-sub-controls">
            <button class="btn-pill-sub" id="btn-lang" onclick="toggleLanguage()">🌐 🇮🇳 Hindi</button>
            <button class="btn-pill-sub" id="btn-speed" onclick="cycleSpeed()">⚡ 0.9x</button>
            <button class="btn-pill-sub" id="btn-music" onclick="toggleMusic()">🎵 Bg Music: ON</button>
        </div>
    </div>

    <script>
        const storyData = {
            titleHi: 'चालाक खरगोश और खूंखार शेर',
            titleEn: 'The Clever Rabbit and the Lion',
            subHi: 'बुद्धि बल से कई गुना शक्तिशाली होती है',
            subEn: 'Wisdom is far superior to mere physical brute strength',
            theme: 'moral',
            sentencesHi: [
                'एक घने जंगल में भासुरक नाम का एक बहुत ही खूंखार शेर रहता था।',
                'वह हर रोज़ जंगल के कई मासूम जानवरों को मारकर खा जाता था।',
                'सभी जानवरों ने मिलकर फैसला किया कि रोज़ एक जानवर खुद शेर के पास जाएगा।',
                'एक दिन एक नन्हे चालाक खरगोश की बारी आई। वह जानबूझकर शेर के पास बहुत देर से पहुँचा।',
                'शेर गुस्से से आगबबूला होकर दहाड़ा, "इतनी देर क्यों लगाई?"',
                'खरगोश ने हाथ जोड़कर कहा, "महाराज! रास्ते में मुझे आपसे भी बड़ा और ताकतवर शेर मिल गया था, उसने मुझे रोक लिया था!"',
                'क्रोधित शेर बोला, "मुझे तुरंत उस दूसरे शेर के पास ले चलो, मैं उसे अभी खत्म कर दूंगा!"',
                'खरगोश शेर को एक गहरे कुएं के पास ले गया और बोला, "महाराज, वह इसी किले में छिपा है!"',
                'शेर ने कुएं में झांका, तो उसे पानी में अपनी ही परछाईं दिखाई दी।',
                'शेर ने उसे दूसरा शेर समझा और जोर से दहाड़ मारते हुए कुएं में छलांग लगा दी और डूबकर मर गया!',
                'नन्हे खरगोश की सूझबूझ से जंगल के सभी जानवरों की जान हमेशा के लिए बच गई।',
                'सीख: संकट के समय घबराने के बजाय अपनी बुद्धि और चतुराई का उपयोग करना चाहिए।'
            ],
            sentencesEn: [
                'In a deep green forest lived a ferocious lion named Bhasuraka.',
                'He relentlessly hunted and terrorized all the innocent animals every single day.',
                'The forest animals held a meeting and agreed to send one animal daily for his meal.',
                'One day, the turn came for a tiny but exceptionally clever rabbit. He deliberately arrived very late.',
                'The starving lion roared with thunderous rage, "Why are you so late, little creature?"',
                'The rabbit bowed humbly, "Your Majesty! Another mighty lion stopped me on the way and claimed he is the true king!"',
                'Furious, the lion demanded, "Take me to this imposter right now; I will tear him apart!"',
                'The rabbit led the arrogant lion to a deep stone well and whispered, "Look inside, he hides in this fortress!"',
                'The lion peered into the dark well and saw his own reflection shimmering in the clear water.',
                'Roaring in fury at his reflection, the foolish lion leaped into the deep well and drowned!',
                'With sheer wit and intelligence, the little rabbit saved every animal in the forest forever.',
                'Moral: Wisdom and presence of mind can defeat even the greatest brute power.'
            ]
        };

        let currentSentenceIndex = 0;
        let currentLang = 'hi';
        let currentVoiceGender = 'female';
        let playbackSpeed = 0.92;
        let isPlaying = false;
        let speechTimer = null;
        let wordTimer = null;
        let audioCtx = null;
        let gainNode = null;
        let isMusicEnabled = true;

        function startThemeMusic() {
            try {
                if (!isMusicEnabled) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (gainNode) return;

                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.025, audioCtx.currentTime);
                gainNode.connect(audioCtx.destination);

                const freqs = [130.81, 164.81, 196.00, 261.63];
                freqs.forEach(f => {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(450, audioCtx.currentTime);
                    osc.connect(filter);
                    filter.connect(gainNode);
                    osc.start();
                });
            } catch(e) {}
        }

        function stopThemeMusic() {
            try {
                if (gainNode && audioCtx) {
                    gainNode.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
                    setTimeout(() => { gainNode = null; }, 400);
                }
            } catch(e) {}
        }

        function toggleMusic() {
            isMusicEnabled = !isMusicEnabled;
            document.getElementById('btn-music').textContent = isMusicEnabled ? '🎵 Bg Music: ON' : '🔇 Bg Music: OFF';
            if (isMusicEnabled && isPlaying) startThemeMusic();
            else stopThemeMusic();
        }

        function getVoiceForGender(lang, gender) {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            if (!voices || voices.length === 0) return null;
            if (lang === 'hi') {
                const hi = voices.filter(v => v.lang.startsWith('hi') || v.name.includes('Hindi') || v.name.includes('हिन्दी'));
                if (hi.length > 0) {
                    if (gender === 'female') {
                        const f = hi.find(v => v.name.includes('Kalpana') || v.name.includes('Female') || v.name.includes('Google हिन्दी'));
                        if (f) return f;
                    } else if (gender === 'male') {
                        const m = hi.find(v => v.name.includes('Hemant') || v.name.includes('Male'));
                        if (m) return m;
                    }
                    return hi[0];
                }
            }
            const en = voices.filter(v => v.lang === 'en-IN' || v.name.includes('India'));
            if (en.length > 0) {
                if (gender === 'female') {
                    const f = en.find(v => v.name.includes('Female') || v.name.includes('Heera') || v.name.includes('Zira'));
                    if (f) return f;
                } else if (gender === 'male') {
                    const m = en.find(v => v.name.includes('Male') || v.name.includes('Ravi') || v.name.includes('David'));
                    if (m) return m;
                }
                return en[0];
            }
            return voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        function onVoiceDropdownChange(val) {
            currentVoiceGender = val;
            if (isPlaying) speakCurrentSentence();
        }

        function togglePlayPause() {
            if (isPlaying) stopPlayback();
            else startPlayback();
        }

        function startPlayback() {
            isPlaying = true;
            document.getElementById('btn-play-pause').textContent = '⏸';
            document.querySelectorAll('.wave-bar').forEach(b => b.classList.add('playing'));
            startThemeMusic();
            speakCurrentSentence();
        }

        function stopPlayback() {
            isPlaying = false;
            document.getElementById('btn-play-pause').textContent = '▶';
            document.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('playing'));
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (speechTimer) clearTimeout(speechTimer);
            if (wordTimer) clearInterval(wordTimer);
            stopThemeMusic();
        }

        function renderAllSentences() {
            const list = document.getElementById('sentences-list');
            list.innerHTML = '';
            const sentences = currentLang === 'hi' ? storyData.sentencesHi : storyData.sentencesEn;
            
            sentences.forEach((text, sIdx) => {
                const block = document.createElement('div');
                block.className = `story-sentence-block ${sIdx === currentSentenceIndex ? 'sentence-active' : ''}`;
                block.id = `sentence-block-${sIdx}`;
                block.onclick = () => {
                    currentSentenceIndex = sIdx;
                    startPlayback();
                };

                const words = text.trim().split(/\s+/);
                words.forEach((w, wIdx) => {
                    const span = document.createElement('span');
                    span.className = 'karaoke-word';
                    span.id = `w-${sIdx}-${wIdx}`;
                    span.textContent = w + ' ';
                    block.appendChild(span);
                });

                list.appendChild(block);
            });
        }

        function highlightWordInSentence(sIdx, wIdx) {
            document.querySelectorAll('.karaoke-word').forEach(s => s.classList.remove('word-active'));
            const active = document.getElementById(`w-${sIdx}-${wIdx}`);
            if (active) active.classList.add('word-active');
        }

        function scrollSentenceIntoView(sIdx) {
            document.querySelectorAll('.story-sentence-block').forEach((b, idx) => {
                b.classList.toggle('sentence-active', idx === sIdx);
            });
            const el = document.getElementById(`sentence-block-${sIdx}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function speakCurrentSentence() {
            if (!isPlaying) return;
            const sentences = currentLang === 'hi' ? storyData.sentencesHi : storyData.sentencesEn;
            if (currentSentenceIndex >= sentences.length) {
                stopPlayback();
                launchConfetti();
                currentSentenceIndex = 0;
                scrollSentenceIntoView(0);
                return;
            }

            scrollSentenceIntoView(currentSentenceIndex);

            const rawText = sentences[currentSentenceIndex];
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            if (wordTimer) clearInterval(wordTimer);

            const utt = new SpeechSynthesisUtterance(rawText);
            utt.lang = currentLang === 'hi' ? 'hi-IN' : 'en-IN';
            utt.rate = playbackSpeed;

            if (currentVoiceGender === 'female') utt.pitch = 1.08;
            else if (currentVoiceGender === 'male') utt.pitch = 0.85;
            else if (currentVoiceGender === 'child') { utt.pitch = 1.45; utt.rate = playbackSpeed * 1.05; }

            const voice = getVoiceForGender(currentLang, currentVoiceGender);
            if (voice) utt.voice = voice;

            const words = rawText.trim().split(/\s+/);
            let boundaryFired = false;

            utt.onboundary = (e) => {
                if (e.name === 'word') {
                    boundaryFired = true;
                    let count = 0;
                    for (let i = 0; i < words.length; i++) {
                        count += words[i].length + 1;
                        if (e.charIndex < count) {
                            highlightWordInSentence(currentSentenceIndex, i);
                            break;
                        }
                    }
                }
            };

            let wIdx = 0;
            const wordDur = Math.max(160, Math.floor(60000 / (135 * playbackSpeed)));
            wordTimer = setInterval(() => {
                if (!boundaryFired && isPlaying && wIdx < words.length) {
                    highlightWordInSentence(currentSentenceIndex, wIdx);
                    wIdx++;
                }
            }, wordDur);

            utt.onend = () => {
                if (wordTimer) clearInterval(wordTimer);
                highlightWordInSentence(currentSentenceIndex, words.length - 1);
                if (!isPlaying) return;
                speechTimer = setTimeout(() => {
                    currentSentenceIndex++;
                    speakCurrentSentence();
                }, 220);
            };

            utt.onerror = () => {
                if (wordTimer) clearInterval(wordTimer);
                if (!isPlaying) return;
                currentSentenceIndex++;
                speakCurrentSentence();
            };

            window.speechSynthesis.speak(utt);
        }

        function prevSentence() {
            if (currentSentenceIndex > 0) {
                currentSentenceIndex--;
                if (isPlaying) speakCurrentSentence();
                else scrollSentenceIntoView(currentSentenceIndex);
            }
        }

        function nextSentence() {
            const total = (currentLang === 'hi' ? storyData.sentencesHi : storyData.sentencesEn).length;
            if (currentSentenceIndex < total - 1) {
                currentSentenceIndex++;
                if (isPlaying) speakCurrentSentence();
                else scrollSentenceIntoView(currentSentenceIndex);
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'hi' ? 'en' : 'hi';
            document.getElementById('btn-lang').textContent = currentLang === 'hi' ? '🌐 🇮🇳 Hindi' : '🌐 🇬🇧 English';
            document.getElementById('player-title').textContent = currentLang === 'hi' ? storyData.titleHi : storyData.titleEn;
            document.getElementById('player-sub').textContent = currentLang === 'hi' ? storyData.subHi : storyData.subEn;
            renderAllSentences();
            if (isPlaying) speakCurrentSentence();
        }

        function cycleSpeed() {
            if (playbackSpeed === 0.92) playbackSpeed = 1.1;
            else if (playbackSpeed === 1.1) playbackSpeed = 0.8;
            else playbackSpeed = 0.92;
            document.getElementById('btn-speed').textContent = `⚡ ${playbackSpeed}x`;
            if (isPlaying) speakCurrentSentence();
        }

        function launchConfetti() {
            const box = document.getElementById('confetti-box');
            const colors = ['#FF6B35', '#E83E8C', '#06D6A0', '#FFD166', '#7928CA'];
            for (let i = 0; i < 35; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-dot';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.width = el.style.height = (6 + Math.random() * 8) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                box.appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAllSentences();
            setTimeout(() => { startPlayback(); }, 300);
        });
        document.body.addEventListener('click', () => {
            if (!isPlaying && currentSentenceIndex === 0) startPlayback();
        }, { once: true });
    </script>
</body>
</html>
