*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:Nunito,system-ui,sans-serif;background:linear-gradient(180deg,#fff8f0,#f5f3ff);color:#172033}.top{position:sticky;top:0;z-index:5;background:#fffdfced;backdrop-filter:blur(12px);box-shadow:0 2px 14px #0001}.nav{max-width:900px;margin:auto;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:19px;font-weight:900;color:#7c3aed;text-decoration:none}.navbtn,.actions a{border:0;background:#f3e8ff;color:#6d28d9;border-radius:12px;padding:10px 12px;font-weight:900;text-decoration:none;cursor:pointer}.wrap{max-width:820px;margin:auto;padding:18px 12px 35px}.hero{text-align:center;background:#fff;border:2px solid #e9d5ff;border-radius:24px;padding:20px 15px;margin-bottom:12px;box-shadow:0 8px 25px #00000009}.emoji{font-size:54px}.hero h1{font-size:clamp(27px,6vw,44px);line-height:1.08;margin:7px 0}.meta{color:#64748b;font-weight:800;font-size:12px}.story{background:#fff;border-radius:20px;padding:20px;border:1px solid #eee;box-shadow:0 8px 25px #00000008}.story p{font-size:18px;line-height:1.72;margin:0 0 15px}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 8px}.toolbar button{width:100%;border:0;border-radius:12px;padding:11px;background:#f3e8ff;color:#6d28d9;font-weight:900;cursor:pointer}.toolbar button:first-child{background:#7c3aed;color:#fff}.quiz{margin-top:18px;padding:15px;border:2px solid #fde68a;background:#fffbeb;border-radius:16px}.quiz h2{font-size:18px;margin:0 0 10px}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:11px;padding:10px;margin:7px 0;font-weight:800;cursor:pointer}.option.correct{border-color:#22c55e;background:#dcfce7}.option.wrong{border-color:#ef4444;background:#fee2e2}.feedback{font-weight:900;margin-top:8px}.lesson{background:#ecfdf5;border:2px solid #86efac;border-radius:16px;padding:14px;margin-top:18px}.lesson b{display:block;margin-bottom:5px;color:#166534}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1;text-align:center}#playStatus{text-align:center;font-size:12px;font-weight:800;color:#64748b;min-height:18px;margin:0 0 10px}footer{text-align:center;color:#94a3b8;font-size:11px;padding-top:18px}@media(max-width:600px){.wrap{padding:12px 9px 28px}.story{padding:16px}.story p{font-size:17px}.toolbar{grid-template-columns:1fr 1fr}.toolbar button:first-child{grid-column:1/-1}.actions{flex-wrap:wrap}.actions>*{min-width:30%}}

<body>
<header class="top"><nav class="nav"><a class="brand" href="index.html">🌈 GIndia Kids</a><button class="navbtn" onclick="history.back()">← Back</button></nav></header>
<main class="wrap">
<section class="hero"><div class="emoji" id="emoji">📖</div><h1 id="title">Loading story…</h1><div class="meta" id="meta"></div></section>
<article class="story" id="storyArticle" style="display:none">
<div class="toolbar"><button id="playBtn" onclick="playStory()">▶️ Play Story</button><button onclick="stopReading()">⏹ Stop</button><button onclick="shareStory()">🔗 Share</button></div>
<div id="playStatus"></div><div id="body"></div>
<div class="lesson"><b>💡 What we learn</b><span id="lesson"></span></div>
<section class="quiz"><h2>🧠 Quick Check</h2><div id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div></section>
<div class="actions"><a id="prev" href="index.html">← Previous</a><a id="catLink" href="index.html">More Stories</a><a id="next" href="index.html">Next →</a></div>
</article>
<footer>GIndia Kids • Read, imagine, learn and share</footer>
</main>
<script src="stories-data.js?v=20260915"></script>
<script>
(function(){
'use strict';
const params=new URLSearchParams(window.location.search);
const raw=params.get('story')||params.get('slug')||'';
function makeSlug(v){return String(v).trim().toLowerCase().replace(/[’'`]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
const requested=makeSlug(raw);
const all=Array.isArray(window.KIDS_STORIES)?window.KIDS_STORIES:[];
const s=all.find(x=>makeSlug(x.slug)===requested||makeSlug(x.title)===requested);
const titleEl=document.getElementById('title');
const article=document.getElementById('storyArticle');
const statusEl=document.getElementById('playStatus');
const playBtn=document.getElementById('playBtn');
let queue=[],queueIndex=0,playing=false;
if(!s){
 titleEl.textContent='Story not found';
 document.getElementById('meta').textContent='Please choose a story from a category.';
 document.getElementById('canonical').href=location.href;
 const p=document.createElement('p');p.textContent='This story link is not available. Please go back and choose another story.';
 article.style.display='block';document.getElementById('body').appendChild(p);
}else{
 article.style.display='block';
 document.title=s.title+' | GIndia Kids';
 document.getElementById('desc').content=s.summary+' Read this short kids story on GIndia Kids.';
 document.getElementById('canonical').href=location.origin+location.pathname+'?story='+encodeURIComponent(s.slug);
 document.getElementById('emoji').textContent=s.emoji;
 titleEl.textContent=s.title;
 document.getElementById('meta').textContent=s.age+' • '+s.minutes+' • '+((window.KIDS_CATEGORIES&&window.KIDS_CATEGORIES[s.category])?window.KIDS_CATEGORIES[s.category].name:'Kids Story');
 document.getElementById('body').innerHTML=(s.body||[]).map(x=>'<p>'+x+'</p>').join('');
 document.getElementById('lesson').textContent=s.lesson;
 document.getElementById('catLink').href='category-'+s.category+'.html';
 const cat=all.filter(x=>x.category===s.category),i=cat.findIndex(x=>x.slug===s.slug);
 const prev=cat[(i-1+cat.length)%cat.length],next=cat[(i+1)%cat.length];
 document.getElementById('prev').href='story.html?story='+encodeURIComponent(prev.slug);
 document.getElementById('next').href='story.html?story='+encodeURIComponent(next.slug);
 document.getElementById('question').textContent=s.question;
 document.getElementById('options').innerHTML=(s.options||[]).map((o,n)=>'<button class="option" onclick="answer('+n+',this)">'+o+'</button>').join('');
}
function setStatus(t){statusEl.textContent=t}
function speakNext(){
 if(!playing||queueIndex>=queue.length){playing=false;playBtn.textContent='▶️ Play Story';setStatus('');return}
 const u=new SpeechSynthesisUtterance(queue[queueIndex++]);u.rate=.88;u.pitch=1.06;u.volume=1;
 const voices=speechSynthesis.getVoices();const v=voices.find(x=>/^en(-|_)/i.test(x.lang))||voices[0];if(v)u.voice=v;
 u.onend=speakNext;u.onerror=function(){playing=false;playBtn.textContent='▶️ Play Story';setStatus('Audio could not start. Tap Play Story again.')};speechSynthesis.speak(u)
}
window.playStory=function(){if(!s)return;if(!('speechSynthesis'in window)){setStatus('This browser does not support story audio.');return}if(playing){if(speechSynthesis.paused)speechSynthesis.resume();return}speechSynthesis.cancel();queue=[s.title].concat(s.body||[],['What we learn: '+s.lesson]);queueIndex=0;playing=true;playBtn.textContent='⏸️ Playing';setStatus('🔊 Story is playing…');speechSynthesis.getVoices();setTimeout(speakNext,150)};
window.stopReading=function(){if('speechSynthesis'in window)speechSynthesis.cancel();playing=false;queue=[];queueIndex=0;playBtn.textContent='▶️ Play Story';setStatus('')};
window.answer=function(n,b){if(!s)return;document.querySelectorAll('.option').forEach(x=>x.disabled=true);const ok=n===s.answer;b.classList.add(ok?'correct':'wrong');document.getElementById('feedback').textContent=ok?'🎉 Correct! Great thinking!':'💡 Not quite. Try the story again and look for the clue.'};
window.shareStory=async function(){try{if(navigator.share){await navigator.share({title:document.title,text:'Read this kids story on GIndia Kids',url:location.href});return}throw 0}catch(e){try{await navigator.clipboard.writeText(location.href);setStatus('🔗 Story link copied!')}catch(_){prompt('Copy this story link:',location.href)}}};
})();
</script>
</body>
</html>
