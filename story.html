<style>
:root{--bg:#fff8f0;--card:#fff;--text:#172033;--sub:#64748b;--p:#7c3aed;--b:#e9d5ff}*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:linear-gradient(180deg,#fff8f0,#f5f3ff);color:var(--text)}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 14px #00000010}.nav{max-width:900px;margin:auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:19px;font-weight:900;color:#7c3aed}.navbtn{border:0;background:#f3e8ff;color:#6d28d9;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer}.wrap{max-width:820px;margin:auto;padding:24px 16px 42px}.hero{text-align:center;background:#fff;border:2px solid var(--b);border-radius:26px;padding:25px 18px;margin-bottom:16px;box-shadow:0 10px 30px #00000009}.hero .emoji{font-size:62px}.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:8px 0}.meta{color:var(--sub);font-weight:800;font-size:13px}.story{background:#fff;border-radius:22px;padding:22px;border:1px solid #eee;box-shadow:0 8px 25px #00000008}.story p{font-size:18px;line-height:1.75;margin:0 0 18px}.lesson{background:#ecfdf5;border:2px solid #86efac;border-radius:18px;padding:16px;margin-top:22px}.lesson b{display:block;margin-bottom:5px;color:#166534}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions a,.actions button{flex:1;min-width:140px;padding:12px;border:0;border-radius:14px;background:#7c3aed;color:#fff;font-weight:900;text-align:center;cursor:pointer}.actions .light{background:#f3e8ff;color:#6d28d9}footer{text-align:center;color:#94a3b8;font-size:12px;padding-top:20px}@media(max-width:640px){.wrap{padding:16px 12px 32px}.story{padding:18px}.story p{font-size:17px}}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
</head><body>
<header class="top"><nav class="nav"><a class="brand" href="index.html">🌈 GIndia Kids</a><button class="navbtn" onclick="history.back()">← Back</button></nav></header>
<main class="wrap"><section class="hero"><div class="emoji" id="emoji">📖</div><h1 id="title">Story</h1><div class="meta" id="meta"></div></section><article class="story"><div id="body"></div><div class="lesson"><b>💡 What we learn</b><span id="lesson"></span></div><div class="actions"><button onclick="shareStory()">🔗 Share Story</button><a class="light" id="catLink" href="index.html">More Stories</a></div></article><footer>GIndia Kids • A happy place to learn and imagine</footer></main>
<script src="stories-data.js"></script><script>
const params=new URLSearchParams(location.search),slug=params.get('story');const s=(window.KIDS_STORIES||[]).find(x=>x.slug===slug);if(!s){document.getElementById('title').textContent='Story not found';document.getElementById('body').innerHTML='<p>This story link is not available. Please return to the story categories.</p>';document.getElementById('lesson').textContent='Choose another story and keep exploring!';}else{document.title=s.title+' | GIndia Kids';document.getElementById('desc').content=s.summary+' Read this short kids story on GIndia Kids.';document.getElementById('canonical').href=location.href;document.getElementById('emoji').textContent=s.emoji;document.getElementById('title').textContent=s.title;document.getElementById('meta').textContent=s.age+' • '+s.minutes+' • '+(window.KIDS_CATEGORIES[s.category]?.name||'Kids Story');document.getElementById('body').innerHTML=s.body.map(p=>'<p>'+p+'</p>').join('');document.getElementById('lesson').textContent=s.lesson;document.getElementById('catLink').href='category-'+s.category+'.html';}
async function shareStory(){try{await navigator.share({title:document.title,text:'Read this kids story on GIndia Kids',url:location.href});}catch(e){try{await navigator.clipboard.writeText(location.href);alert('Story link copied!');}catch(_){prompt('Copy this story link:',location.href)}}}
</script></body></html>
