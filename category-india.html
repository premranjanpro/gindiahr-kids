<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore India Stories for Kids | GIndia Kids</title><meta name="description" content="10 kid-friendly India stories about places, culture, food, festivals and wonders."><link rel="stylesheet" href="category.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="index.html">🌈 GIndia Kids</a><a class="back" href="index.html">← All Categories</a></nav></header><section class="hero"><div class="emoji">🇮🇳</div><h1>Explore India</h1><p>Kid-friendly journeys through places, culture, food, and wonders of India.</p></section><main class="grid" id="stories"></main><footer>GIndia Kids • Stories for curious little minds</footer><script src="stories-data.js"></script><script>const l=KIDS_STORIES.filter(s=>s.category==='india');stories.innerHTML=l.map((s,i)=>`<article class="card"><div><div class="num">STORY ${i+1}</div><div class="title">${s.emoji} ${s.title}</div><div class="meta">${s.age} • ${s.minutes}<br>${s.summary}</div></div><a class="read" href="story.html?story=${encodeURIComponent(s.slug)}">Read Story →</a></article>`).join('')</script></body></html>
